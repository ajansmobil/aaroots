<script>
  /* Mobil menü aç/kapat: class wrapper (.zhcos) üzerinde tutulur; mobilde menü paneli buna göre gösterilir/gizlenir */
  if (typeof menu2_toggle === "undefined") {
    function menu2_toggle() {
      var root = document.getElementById("menu-2-root");
      if (!root) {
        return;
      }
      var wrapper = root.closest ? root.closest(".zhcos") : null;
      var target = wrapper || root;
      if (target.classList.contains("zhcosmenu-open")) {
        target.classList.remove("zhcosmenu-open");
      } else {
        target.classList.add("zhcosmenu-open");
      }
    }
  }
</script>

(function headerSliderInit() {
  var attempts = 0;

  var timer = setInterval(function () {
    attempts++;
    if (typeof Swiper === "function") {
      clearInterval(timer);
      new Swiper(".zdc7a", {
        slidesPerView: 1,
        spaceBetween: 30,
        loop: true,
        autoplay: {
          delay: "3000",
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    } else if (attempts >= maxAttempts) {
      clearInterval(timer);
      console.warn("header/slider: Swiper bulunamadı, slider başlatılamadı.");
    }
  }, 250);
})();
</script>

<script>
  // RTL dil kontrolü - Arapça için sağdan sola yazım desteği
  setTimeout(function() {
    var currentPath = window.location.pathname;
    var rtlLanguages = ['ar', 'he', 'fa']; // RTL diller: Arapça, İbranice, Farsça
    
    // URL'den dil kodunu çıkar (/ar/, /he/, /fa/ gibi)
    var langMatch = currentPath.match(/^\/([a-z]{2})\//);
    var currentLang = langMatch ? langMatch[1] : '';
    
    // Eğer RTL dil ise dir="rtl" set et
    if (rtlLanguages.indexOf(currentLang) !== -1) {
      document.documentElement.setAttribute('dir', 'rtl');
    } else {
      document.documentElement.setAttribute('dir', 'ltr');
    }
  }, 100);
</script>
