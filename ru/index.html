      var root = document.getElementById("menu-2-root");
      if (!root) {
        return;
      }
      var wrapper = root.closest ? root.closest(".eof5d") : null;
      var target = wrapper || root;
      if (target.classList.contains("eof5dmenu-open")) {
        target.classList.remove("eof5dmenu-open");
      } else {
        target.classList.add("eof5dmenu-open");
      }
    }
  }

<script>
  // Intersection Observer ile scroll-based animasyon
setTimeout(function() {
  if (typeof IntersectionObserver !== 'undefined') {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    });

    var items = document.querySelectorAll('.od8gbbodyitem');
    items.forEach(function(item) {
      observer.observe(item);
    });
  } else {
    // Fallback: IntersectionObserver desteklenmiyorsa direkt göster
    var items = document.querySelectorAll('.od8gbbodyitem');
    items.forEach(function(item) {
      item.classList.add('visible');
    });
  }
}, 100);

</script></div>

<script>
  // RTL dil kontrolü - Arapça için sağdan sola yazım desteği
  setTimeout(function() {
    var currentPath = window.location.pathname;
    var rtlLanguages = ['ar', 'he', 'fa']; // RTL diller: Arapça, İbranice, Farsça
    
    // URL'den dil kodunu çıkar (/ar/, /he/, /fa/ gibi)
    var langMatch = currentPath.match(/^\/([a-z]{2})\//);
    var currentLang = langMatch ? langMatch[1] : '';
    
    // Eğer RTL dil ise dir="rtl" set et
    if (rtlLanguages.indexOf(currentLang) !== -1) {
      document.documentElement.setAttribute('dir', 'rtl');
    } else {
      document.documentElement.setAttribute('dir', 'ltr');
    }
  }, 100);
</script>
